name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 用官方 Python 镜像而不是 setup-python：新 runner 镜像会陆续丢掉老版本 Python，
    # 容器里的 3.9 不受 runner 升级影响。
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest pyyaml
      - run: python -m pytest -q
      - name: Scripts start
        run: |
          python skills/quark-search-save/scripts/pansou_search.py --help
          python skills/quark-search-save/scripts/find_quark_cli.py --help
          python skills/quark-search-save/scripts/check_links.py --help
          python skills/quark-search-save/scripts/install_quark_skill.py --help
      - name: Skill folder is self-contained
        run: |
          test -f skills/quark-search-save/SKILL.md
          test -f skills/quark-search-save/scripts/pansou_search.py
          test -f skills/quark-search-save/scripts/find_quark_cli.py
          test -f skills/quark-search-save/scripts/check_links.py
          test -f skills/quark-search-save/scripts/install_quark_skill.py
          for s in pansou_search find_quark_cli install_quark_skill check_links; do
            test -f "skills/quark-search-save/scripts/$s.py" || { echo "missing $s.py"; exit 1; }
            if grep -nE "(^|[^>/])scripts/$s\.py" skills/quark-search-save/SKILL.md | grep -v '<本 Skill 目录>'; then
              echo "SKILL.md must reference scripts/$s.py relative to <本 Skill 目录>"; exit 1
            fi
          done
